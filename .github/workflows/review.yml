name: review
run-name: >-
  review #${{ inputs.pr }}${{
    case(
      inputs.extra-args != '' && inputs.extra-build-args != '',
      format(' ({0} --build-args="{1}")', inputs.extra-args, inputs.extra-build-args),
      inputs.extra-args != '',
      format(' ({0})', inputs.extra-args),
      inputs.extra-build-args != '',
      format(' (--build-args="{0}")', inputs.extra-build-args),
      ''
    )
  }}

permissions: {}

env:
  VM_DIR: /nix/nrgha-vm

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull Request Number"
        required: true
        type: string
      x86_64-linux:
        description: "Run on x86_64-linux"
        required: true
        type: boolean
        default: true
      aarch64-linux:
        description: "Run on aarch64-linux"
        required: true
        type: boolean
        default: true
      x86_64-darwin:
        description: "Run on x86_64-darwin"
        required: true
        type: choice
        default: yes_sandbox_relaxed
        options:
          - "no"
          - yes_sandbox_false
          - yes_sandbox_relaxed
          - yes_sandbox_true
      aarch64-darwin:
        description: "Run on aarch64-darwin"
        required: true
        type: choice
        default: yes_sandbox_relaxed
        options:
          - "no"
          - yes_sandbox_false
          - yes_sandbox_relaxed
          - yes_sandbox_true
      riscv64-linux:
        description: "Run on riscv64-linux (RISE runners)"
        required: true
        type: boolean
        default: false
      allow-unfree:
        description: "Allow unfree packages"
        required: true
        type: boolean
        default: true
      allow-insecure:
        description: "Allow insecure packages"
        required: true
        type: boolean
        default: true
      builders:
        description: "Nix builders to use"
        required: true
        type: choice
        default: "gha"
        options:
          - "gha"
          - "remote"
          - "both"
      relay-after:
        description: "Minutes after which an unfinished review hands its builds to a follow-up job (0 to disable)"
        required: true
        type: number
        default: 300
      vm:
        description: "Run the x86_64-linux review in a VM that moves to the next leg at hand-offs, so that running builds continue"
        required: true
        type: boolean
        default: false
      extra-args:
        description: "nixpkgs-review extra args"
        required: false
        type: string
      extra-build-args:
        description: "nixpkgs-review extra --build-args"
        required: false
        type: string
      push-to-cache:
        description: "Push to cache"
        required: true
        type: boolean
        default: true
      upterm:
        description: "Start upterm session after nixpkgs-review"
        required: true
        type: boolean
        default: false
      post-result:
        description: "Post Result"
        required: true
        type: boolean
        default: true
      on-success:
        description: "What to do on review success"
        required: true
        type: choice
        default: nothing
        options:
          - nothing
          - mark_as_ready
          - approve
          - merge

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.prepare.outputs.pr }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /review

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - run: nu review/prepare.nu
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(github.event.inputs) }}
          HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' && '1' || '0' }}

  review:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - aarch64-darwin
          - riscv64-linux
        exclude:
          - system: ${{ !inputs.x86_64-linux && 'x86_64-linux' || '' }}
          - system: ${{ !inputs.aarch64-linux && 'aarch64-linux' || '' }}
          - system: ${{ inputs.x86_64-darwin == 'no' && 'x86_64-darwin' || '' }}
          - system: ${{ inputs.aarch64-darwin == 'no' && 'aarch64-darwin' || '' }}
          - system: ${{ !inputs.riscv64-linux && 'riscv64-linux' || '' }}
    runs-on: &runs-on >-
      ${{ (matrix.system == 'x86_64-linux' && 'ubuntu-latest')
      || (matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm')
      || (matrix.system == 'x86_64-darwin' && 'macos-latest')
      || (matrix.system == 'aarch64-darwin' && 'macos-latest')
      || (matrix.system == 'riscv64-linux' && 'ubuntu-24.04-riscv') }}
    env:
      RELAY_LEG: 1
      RELAY_LAST_LEG: false

    steps: &review-steps
      - name: record start time
        id: start
        run: echo "time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /review
            /flake.lock
            /flake.nix
            /patches
            /drv-build-support.nix

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - name: setup nix
        uses: $/.github/actions/setup-nix
        with:
          extra-nix-config: ${{ vars.EXTRA_NIX_CONFIG }}
          system: ${{ matrix.system }}
          sandbox: ${{
            (matrix.system == 'x86_64-darwin' && inputs.x86_64-darwin == 'yes_sandbox_false'
            || matrix.system == 'aarch64-darwin' && inputs.aarch64-darwin == 'yes_sandbox_false') && 'false'
            || (matrix.system == 'x86_64-darwin' && inputs.x86_64-darwin == 'yes_sandbox_relaxed'
            || matrix.system == 'aarch64-darwin' && inputs.aarch64-darwin == 'yes_sandbox_relaxed') && 'relaxed'
            || 'true' }}
          builders: ${{ inputs.builders != 'gha' && vars.BUILDERS || '' }}
          ssh-key: ${{ inputs.builders != 'gha' && secrets.SSH_KEY || '' }}
          ssh-cert: ${{ inputs.builders != 'gha' && secrets.SSH_CERT || '' }}

      - name: clone nixpkgs
        if: ${{ !(inputs.vm && matrix.system == 'x86_64-linux') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NixOS/nixpkgs
          path: nixpkgs
          persist-credentials: false

      - name: download builds from earlier legs
        if: ${{ env.RELAY_LEG != '1' && !(inputs.vm && matrix.system == 'x86_64-linux') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay_${{ matrix.system }}_*
          path: relay-in
          merge-multiple: true

      - name: create the VM directory
        if: ${{ inputs.vm && matrix.system == 'x86_64-linux' }}
        run: sudo mkdir -p "$VM_DIR/in" && sudo chown -R "$USER" "$VM_DIR"

      - name: download the VM from the previous leg
        if: ${{ env.RELAY_LEG != '1' && inputs.vm && matrix.system == 'x86_64-linux' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm_${{ matrix.system }}_${{ env.RELAY_PREV_LEG }}
          path: ${{ env.VM_DIR }}/in

      - name: run the review in a VM
        id: vm
        if: ${{ inputs.vm && matrix.system == 'x86_64-linux' }}
        run: nix run .#python3 -- review/vm/host.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(github.event.inputs) }}
          PR_JSON: ${{ needs.prepare.outputs.pr }}
          IDENTIFY_STILL_FAILING_PACKAGES: ${{ vars.IDENTIFY_STILL_FAILING_PACKAGES }}
          IDENTIFY_UNSUPPORTED_PACKAGES: ${{ vars.IDENTIFY_UNSUPPORTED_PACKAGES }}
          EXTRA_NIX_CONFIG: ${{ vars.EXTRA_NIX_CONFIG }}
          JOB_STARTED_AT: ${{ steps.start.outputs.time }}

      - run: nu review/review.nu
        id: review
        if: ${{ !(inputs.vm && matrix.system == 'x86_64-linux') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(github.event.inputs) }}
          ATTIC_SERVER: ${{ vars.ATTIC_SERVER }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
          PR_JSON: ${{ needs.prepare.outputs.pr }}
          IDENTIFY_STILL_FAILING_PACKAGES: ${{ vars.IDENTIFY_STILL_FAILING_PACKAGES }}
          IDENTIFY_UNSUPPORTED_PACKAGES: ${{ vars.IDENTIFY_UNSUPPORTED_PACKAGES }}
          JOB_STARTED_AT: ${{ steps.start.outputs.time }}

      - if: steps.review.outputs.relay != 'true' && steps.vm.outputs.relay != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report_${{ matrix.system }}.json
          path: report_${{ matrix.system }}.json
          if-no-files-found: error
          archive: false

      - name: upload builds for the next leg
        if: steps.review.outputs.relay == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay_${{ matrix.system }}_${{ env.RELAY_LEG }}
          path: relay-out
          if-no-files-found: error
          retention-days: 1

      - name: upload the VM for the next leg
        if: steps.vm.outputs.relay == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm_${{ matrix.system }}_${{ env.RELAY_LEG }}
          path: ${{ env.VM_DIR }}/out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: start upterm session
        if: ${{ inputs.upterm && steps.review.outputs.relay != 'true' && steps.vm.outputs.relay != 'true' }}
        uses: owenthereal/action-upterm@175d33786004a53b1538bcf157402b7197ce5029 # v2.6.0
        with:
          limit-access-to-actor: true

  # Each handoff job lists the systems whose review handed off in the previous leg
  handoff-1:
    needs: [review]
    if: ${{ !cancelled() && !failure() && inputs.relay-after > 0 }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      RELAY_LEG: 1
    outputs:
      systems: ${{ steps.handoff.outputs.systems }}

    steps: &handoff-steps
      - name: find handed off reviews
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name' > artifacts
          jq -Rnc --arg leg "$RELAY_LEG" '
            [inputs] as $names
            | [$names[] | capture("^(relay|vm)_(?<system>.+)_\($leg)$").system]
            | map(select(("report_\(.).json") as $report | $names | any(. == $report) | not))
          ' artifacts | sed 's/^/systems=/' | tee -a "$GITHUB_OUTPUT"

  review-2:
    needs: [prepare, handoff-1]
    if: ${{ !cancelled() && !failure() && needs.handoff-1.result == 'success' && needs.handoff-1.outputs.systems != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.handoff-1.outputs.systems) }}
    runs-on: *runs-on
    env:
      RELAY_LEG: 2
      RELAY_PREV_LEG: 1
      RELAY_LAST_LEG: false
    steps: *review-steps

  handoff-2:
    needs: [review-2]
    if: ${{ !cancelled() && !failure() && needs.review-2.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      RELAY_LEG: 2
    outputs:
      systems: ${{ steps.handoff.outputs.systems }}
    steps: *handoff-steps

  review-3:
    needs: [prepare, handoff-2]
    if: ${{ !cancelled() && !failure() && needs.handoff-2.result == 'success' && needs.handoff-2.outputs.systems != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.handoff-2.outputs.systems) }}
    runs-on: *runs-on
    env:
      RELAY_LEG: 3
      RELAY_PREV_LEG: 2
      RELAY_LAST_LEG: true
    steps: *review-steps

  report:
    runs-on: ubuntu-latest
    needs: [prepare, review, review-2, review-3]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /review

      - name: setup nu
        uses: $/.github/actions/setup-nu

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report_*
          merge-multiple: true

      - run: nu review/report.nu
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUTS: ${{ toJSON(github.event.inputs) }}
          PR_JSON: ${{ needs.prepare.outputs.pr }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.workflow_sha }}
          API_URL: ${{ vars.API_URL }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports.json
          path: reports.json
          if-no-files-found: error
          archive: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report.md
          path: report.md
          if-no-files-found: error
          archive: false
