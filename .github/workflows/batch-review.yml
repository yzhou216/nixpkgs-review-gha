name: batch-review

permissions: {}

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of reviews to dispatch (empty for no limit)"
        required: false
        type: string
      dry-run:
        description: "Check candidates without dispatching reviews or saving state"
        required: true
        type: boolean
        default: false
  schedule:
    # Fallback only, since each run starts the next one
    - cron: "17 * * * *"

concurrency:
  # Scheduled runs only restart a broken chain, so they must not wait behind it
  group: ${{ github.event_name == 'schedule' && format('batch-review-{0}', github.run_id) || 'batch-review' }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      actions: write
      checks: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: batch-review
          persist-credentials: false

      - name: dispatch reviews
        run: python3 dispatch.py candidates.json state.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry-run }}

      - name: save state
        if: ${{ always() && !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -q -m "batch-review: update state"
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git pull -q --rebase "$url" batch-review
          git push -q "$url" HEAD:batch-review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
