name: batch-review

permissions: {}

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of reviews to dispatch (empty for no limit)"
        required: false
        type: string
      dry-run:
        description: "Check candidates without dispatching reviews or saving state"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: batch-review
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: batch-review
          persist-credentials: false

      - name: dispatch reviews
        run: python3 dispatch.py candidates.json state.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry-run }}

      - name: save state
        if: ${{ always() && !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "batch-review: update state"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:batch-review
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
